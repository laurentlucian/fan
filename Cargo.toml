[workspace]
members = ["src-tauri", "crates/fan-core", "crates/fan-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/laurentlucian/fan"

[workspace.dependencies]
fan-core = { path = "crates/fan-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
